name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format and lint
        run: npm run lint

      - name: Type check
        run: npm run check

      # The algorithm library is verified against the cube engine here: every
      # algorithm is executed and checked against what its set claims to do, so a
      # mistyped move cannot reach the site.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
