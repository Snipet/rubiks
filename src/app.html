<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#7c8cff" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#0a0d11" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
		<script>
			// Adopt saved appearance settings before first paint, so switching theme
			// or palette never flashes the wrong colours on a hard refresh.
			try {
				var raw = localStorage.getItem('cubecraft:settings:v1');
				if (raw) {
					var s = JSON.parse(raw);
					var root = document.documentElement;
					if (s.theme && s.theme !== 'system') root.setAttribute('data-theme', s.theme);
					if (s.palette) root.setAttribute('data-palette', s.palette);
					if (s.density) root.setAttribute('data-density', s.density);
					if (s.motion && s.motion !== 'system') root.setAttribute('data-motion', s.motion);
					if (typeof s.turnSpeed === 'number') {
						root.style.setProperty('--turn-duration', s.turnSpeed + 'ms');
					}
				}
			} catch (e) {
				/* storage unavailable — defaults are fine */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
